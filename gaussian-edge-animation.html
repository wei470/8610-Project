<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高斯项如何叠成 F₁(x₁)</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f3f3ed;
    --surface: #fffefa;
    --ink: #172b2d;
    --muted: #51696a;
    --line: #dce4dd;
    --grid: #e5ebe5;
    --axis: #819694;
    --current: #006f69;
    --reference: #586776;
    --term: #9b442b;
    --selected: #e4f2ed;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #151f20; --surface: #1b292a; --ink: #e8f2ee; --muted: #b5c7c4;
      --line: #384c4b; --grid: #344746; --axis: #829994; --current: #77d8c2;
      --reference: #acbad1; --term: #f3a286; --selected: #23443e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  main { width: min(1120px, calc(100% - 56px)); margin: 36px auto 32px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(1.65rem, 4vw, 2.65rem); letter-spacing: -.035em; line-height: 1.2; }
  h2 { font-size: 1.12rem; line-height: 1.4; }
  .subtitle { margin-top: 9px; color: var(--muted); font-size: .93rem; line-height: 1.65; }
  .plot { margin-top: 21px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); padding: 16px 18px 13px; }
  .plot-head, .term-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 11px 18px; }
  .formula { font-size: .93rem; font-weight: 650; }
  .status { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chart { width: 100%; height: clamp(231px, 36vw, 350px); display: block; }
  .legend { display: flex; align-items: center; gap: 7px 20px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend [hidden] { display: none; }
  .swatch { width: 23px; border-top: 3px solid var(--current); }
  .original { border-top: 2px dashed var(--reference); }
  .contribution { border-top: 2px dotted var(--term); }
  #selection-detail { margin-top: 10px; min-height: 1.45em; font-size: .83rem; color: var(--muted); }
  .terms { margin-top: 23px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--current); outline-offset: 2px; }
  .action { min-height: 38px; padding: 6px 11px; font-size: .84rem; white-space: nowrap; }
  .action:hover:not(:disabled) { border-color: var(--current); }
  .action:disabled { opacity: .49; cursor: default; }
  #play { color: var(--surface); background: var(--current); border-color: var(--current); }
  .term-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 9px; margin-top: 12px; }
  .term { display: grid; grid-template-columns: 1fr 17px; grid-template-rows: auto 33px auto; align-items: center; text-align: start; padding: 8px 9px 7px; min-width: 0; }
  .term:hover { border-color: var(--axis); }
  .term[aria-pressed="true"] { background: var(--selected); border-color: var(--current); }
  .term-title { font-weight: 650; font-size: .87rem; }
  .term-toggle { color: var(--current); font-size: .95rem; text-align: end; }
  .term canvas { grid-column: span 2; width: 100%; height: 33px; display: block; }
  .term-weight { grid-column: span 2; color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums; }
  footer { margin-top: 15px; color: var(--muted); font-size: .79rem; line-height: 1.6; }
  @media (max-width: 885px) { .term-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (max-width: 550px) {
    main { width: calc(100% - 24px); margin-top: 21px; }
    .plot { padding-inline: 9px; margin-top: 15px; }
    .plot-head { gap: 5px; }
    .term-grid { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
    .term { padding-inline: 6px; }
  }
  @media (max-width: 355px) { .term-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>高斯项如何叠成 F₁(x₁)</h1>
    <p class="subtitle">点选下面的小图，将对应的高斯项加入当前曲线。再点一次就移除。</p>
  </header>
  <section class="plot" aria-label="拟合曲线对比">
    <div class="plot-head">
      <p class="formula">F₁(x₁) = 11 个加权高斯项</p>
      <p id="model-status" class="status" aria-live="polite"></p>
    </div>
    <canvas class="chart" id="edge-chart" role="img" aria-label="横轴是标准化后的 X₁，虚线是训练好的 F₁，实线是选中项的和。"></canvas>
    <div class="legend" aria-label="图例">
      <span><i class="swatch original" aria-hidden="true"></i>训练好的 F₁</span>
      <span><i class="swatch" aria-hidden="true"></i>当前叠加</span>
      <span id="recent-key" hidden><i class="swatch contribution" aria-hidden="true"></i><b id="recent-label">刚操作的高斯项</b></span>
    </div>
    <p id="selection-detail">从零开始，点击任意高斯项加入曲线。</p>
  </section>
  <section class="terms" aria-labelledby="terms-title">
    <div class="term-head">
      <h2 id="terms-title">11 个加权高斯项</h2>
      <div class="controls">
        <button class="action" id="play" type="button">按顺序播放</button>
        <button class="action" id="all" type="button">全部加入</button>
        <button class="action" id="reset" type="button">重置</button>
      </div>
    </div>
    <div class="term-grid" id="term-grid" aria-label="按网格中心选择高斯项"></div>
  </section>
  <footer>来自项目的随机行划分实验（种子 101）。展示的是 X₁ 到第一个隐藏节点的一条连接。小图使用相同的纵轴范围。</footer>
</main>

<script>
  'use strict';
  const data = JSON.parse(document.getElementById('trained-data').textContent);
  const gaussian = (x, center) => Math.exp(-(((x - center) / data.scale) ** 2));
  const curves = data.centers.map((center, k) => data.x.map((x) => data.weights[k] * gaussian(x, center)));
  const selected = new Set();
  const chart = document.getElementById('edge-chart');
  const grid = document.getElementById('term-grid');
  const play = document.getElementById('play');
  const all = document.getElementById('all');
  const reset = document.getElementById('reset');

  const detail = document.getElementById('selection-detail');

  const recentLabel = document.getElementById('recent-label');

  const scheme = matchMedia('(prefers-color-scheme: dark)');
  const fmt = (value, places) => String(places === undefined ? value : value.toFixed(places)).replace('-', '−');
  const miniLimit = Math.max(...data.weights.slice(1).map(Math.abs)) * 1.07;
  const minPossible = data.x.map((_, i) => curves.reduce((sum, row) => sum + Math.min(0, row[i]), 0));
  const maxPossible = data.x.map((_, i) => curves.reduce((sum, row) => sum + Math.max(0, row[i]), 0));
  const tickSize = 0.2;
  const yMin = Math.floor((Math.min(...minPossible) - .025) / tickSize) * tickSize;
  const yMax = Math.ceil((Math.max(...maxPossible) + .025) / tickSize) * tickSize;
  let frame = 0;
  let timer = 0;
  let playing = false;
  let recent = null;
  let visible = data.x.map(() => 0);
  let plotStyle;

  function refreshColors() {
    const styles = getComputedStyle(document.documentElement);
    plotStyle = Object.fromEntries(['ink', 'muted', 'axis', 'grid', 'current', 'reference', 'term']
      .map((key) => [key, styles.getPropertyValue(`--${key}`).trim()]));
  }

  const tiles = data.centers.map((center, k) => {
    const button = document.createElement('button');
    button.className = 'term';
    button.type = 'button';
    button.setAttribute('aria-pressed', 'false');
    button.setAttribute('aria-label', `高斯项，中心 ${fmt(center)}，系数 ${fmt(data.weights[k], 3)}`);
    const name = document.createElement('span');
    name.className = 'term-title';
    name.textContent = `中心 ${fmt(center)}`;
    const toggle = document.createElement('span');
    toggle.className = 'term-toggle';
    toggle.setAttribute('aria-hidden', 'true');
    toggle.textContent = '+';
    const mini = document.createElement('canvas');
    mini.setAttribute('aria-hidden', 'true');
    const coeff = document.createElement('span');
    coeff.className = 'term-weight';
    coeff.textContent = `c = ${fmt(data.weights[k], 3)}`;
    button.append(name, toggle, mini, coeff);
    grid.append(button);
    button.addEventListener('click', () => {
      stopPlayback();
      toggleTerm(k);
    });
    return {button, mini, toggle};
  });

  function surface(canvas) {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const ratio = Math.min(devicePixelRatio || 1, 3);
    const pixelWidth = Math.round(width * ratio);
    const pixelHeight = Math.round(height * ratio);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    return {ctx, width, height};
  }

  function segment(ctx, x0, y0, x1, y1) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  function trace(ctx, values, toX, toY, color, width, dash = []) {
    ctx.beginPath();
    for (let i = 0; i < values.length; i++) {
      const x = toX(data.x[i]);
      const y = toY(values[i]);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = dash.length ? 'butt' : 'round';
    ctx.setLineDash(dash);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function mainChart() {
    const {ctx, width, height} = surface(chart);
    const left = 54, top = 24, right = width - 14, bottom = height - 46;
    const toX = (x) => left + (x - data.x[0]) * (right - left) / (data.x.at(-1) - data.x[0]);
    const toY = (y) => bottom - (y - yMin) * (bottom - top) / (yMax - yMin);
    const xTicks = width < 440 ? [-3, -1.5, 0, 1.5, 3] : [-3, -2, -1, 0, 1, 2, 3];
    ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 1;
    for (const tick of xTicks) {
      const x = toX(tick);
      ctx.strokeStyle = plotStyle.grid;
      segment(ctx, x, top, x, bottom);
      ctx.fillStyle = plotStyle.muted;
      ctx.textAlign = 'center';
      ctx.fillText(fmt(tick), x, bottom + 17);
    }
    for (let index = Math.round(yMin / tickSize); index <= Math.round(yMax / tickSize); index++) {
      const value = index * tickSize;
      const y = toY(value);
      ctx.strokeStyle = index === 0 ? plotStyle.axis : plotStyle.grid;
      segment(ctx, left, y, right, y);
      ctx.fillStyle = plotStyle.muted;
      ctx.textAlign = 'right';
      ctx.fillText(index === 0 ? '0' : fmt(value, 1), left - 8, y + 4);
    }
    ctx.strokeStyle = plotStyle.axis;
    segment(ctx, left, top, left, bottom);
    segment(ctx, left, bottom, right, bottom);
    ctx.fillStyle = plotStyle.muted;
    ctx.textAlign = 'left';
    ctx.fillText('连接贡献', left, 14);
    ctx.textAlign = 'center';
    ctx.fillText('标准化后的 X₁', (left + right) / 2, height - 7);

    if (recent !== null) trace(ctx, curves[recent.index], toX, toY, plotStyle.term, 1.7, [2, 4]);
    trace(ctx, data.target, toX, toY, plotStyle.reference, 2.4, [7, 5]);
    trace(ctx, visible, toX, toY, plotStyle.current, 3);
  }

  function drawTiles() {
    tiles.forEach(({mini}, index) => {
      const {ctx, width, height} = surface(mini);
      const toX = (x) => 2 + (x - data.x[0]) * (width - 4) / (data.x.at(-1) - data.x[0]);
      const toY = (y) => height / 2 - y * (height / 2 - 1.5) / miniLimit;
      ctx.strokeStyle = plotStyle.axis;
      ctx.lineWidth = 1;
      segment(ctx, 2, height / 2, width - 2, height / 2);
      trace(ctx, curves[index], toX, toY, selected.has(index) ? plotStyle.current : plotStyle.term, 1.8);
    });
  }

  function sumCurve() {
    return data.x.map((_, i) => curves.reduce((value, row, k) => selected.has(k) ? value + row[i] : value,
      0));
  }

  function moveCurve(next) {
    cancelAnimationFrame(frame);
    if (reduced.matches) {
      visible = next;
      mainChart();
      return;
    }
    const before = visible.slice();
    const begin = performance.now();
    const step = (now) => {
      const progress = Math.min(1, (now - begin) / 340);
      const ease = 1 - (1 - progress) ** 3;
      visible = next.map((value, i) => before[i] + (value - before[i]) * ease);
      mainChart();
      if (progress < 1) frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
  }

  function updateControls() {
    play.textContent = playing ? '暂停' : '按顺序播放';
    play.disabled = !playing && selected.size === curves.length;
    all.disabled = selected.size === curves.length;
    reset.disabled = selected.size === 0 && recent === null;
  }

  function update(animate = true) {
    const next = sumCurve();
    const rmse = Math.sqrt(next.reduce((sum, value, i) => sum + (value - data.target[i]) ** 2, 0) / next.length);
    const difference = rmse < 1e-12 ? '重合' : rmse.toFixed(4);
    status.textContent = `已加入 ${selected.size} / ${curves.length} 项 · 曲线差异（RMSE）${difference}`;
    tiles.forEach(({button, toggle}, k) => {
      button.setAttribute('aria-pressed', String(selected.has(k)));
      toggle.textContent = selected.has(k) ? '✓' : '+';
    });
    recentKey.hidden = recent === null;
    if (recent) recentLabel.textContent = recent.added ? '刚加入的项' : '刚移除的项';
    if (selected.size === curves.length) {
      detail.textContent = '11 个高斯项已加齐，当前曲线与目标重合。';
    } else if (recent) {
      detail.textContent = `${recent.added ? '加入' : '移除'}中心 ${fmt(data.centers[recent.index])} 的项。它在中心的贡献为 ${fmt(data.weights[recent.index], 3)}。`;
    } else {
      detail.textContent = '从零开始，点击任意高斯项加入曲线。';
    }
    updateControls();
    drawTiles();
    if (animate) moveCurve(next);
    else {
      visible = next;
      mainChart();
    }
  }

  function toggleTerm(index) {
    const added = !selected.has(index);
    if (added) selected.add(index);
    else selected.delete(index);
    recent = {index, added};
    update();
  }

  function stopPlayback() {
    clearTimeout(timer);
    playing = false;
    updateControls();
  }

  function nextTerm() {
    const index = curves.findIndex((_, k) => !selected.has(k));
    if (index === -1) {
      stopPlayback();
      return;
    }
    toggleTerm(index);
    if (selected.size === curves.length) stopPlayback();
    else timer = setTimeout(nextTerm, 700);
  }

  play.addEventListener('click', () => {
    if (playing) stopPlayback();
    else {
      playing = true;
      nextTerm();
    }
  });
  all.addEventListener('click', () => {
    stopPlayback();
    curves.forEach((_, k) => selected.add(k));
    recent = null;
    update();
  });
  reset.addEventListener('click', () => {
    stopPlayback();
    selected.clear();
    recent = null;
    update();
  });
  refreshColors();
  update(false);
  const redraw = () => { mainChart(); drawTiles(); };
  const resize = new ResizeObserver(redraw);
  resize.observe(chart);
  resize.observe(grid);
  scheme.addEventListener('change', () => { refreshColors(); redraw(); });
</script>
</body>
</html>
